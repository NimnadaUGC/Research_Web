                                ${slide.bullets.map(b => `<p class="leading-relaxed">${b}</p>`).join('')}
                            </div>
                        </div>
                    `;
                } else if (slide.layout === "section") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center items-center text-center py-10">
                            <span class="text-xs font-bold text-accent-lime uppercase tracking-widest bg-slate-950 px-4 py-1.5 rounded-full border border-slate-800 mb-6">${slide.part}</span>
                            <h2 class="text-4xl lg:text-[56px] font-extrabold text-white font-heading tracking-tight leading-tight max-w-4xl">
                                ${slide.title}
                            </h2>
                            <div class="w-24 h-1.5 bg-accent-teal rounded-full my-6"></div>
                            <p class="text-lg text-slate-400 max-w-2xl leading-relaxed">
                                ${slide.bullets[0]}
                            </p>
                        </div>
                    `;
                } else if (slide.layout === "profile") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center">
                            <h2 class="slide-title">${slide.title}</h2>
                            <p class="text-slate-400 text-xs -mt-6 mb-6 font-medium">${slide.subtitle}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-950 p-6 rounded-xl border border-slate-800/60 shadow-inner">
                                <div class="flex flex-col justify-center items-center p-6 border-r border-slate-800/50 hidden md:flex">
                                    <div class="w-32 h-32 bg-slate-900 rounded-full flex items-center justify-center border-4 border-accent-teal/20 text-accent-teal mb-4">
                                        <i class="fa-solid fa-user-graduate text-5xl"></i>
                                    </div>
                                    <h3 class="text-lg font-bold text-slate-200 font-heading">SC/2021/12375</h3>
                                    <p class="text-xs text-slate-500 mt-1">University of Ruhuna</p>
                                </div>
                                <div class="space-y-3.5 flex flex-col justify-center">
                                    ${slide.bullets.map(b => `<p class="text-sm text-slate-300 border-l-2 border-slate-800 pl-3 leading-relaxed">${b}</p>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (slide.layout === "split") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center">
                            <h2 class="slide-title">${slide.title}</h2>
                            <p class="text-slate-400 text-xs -mt-6 mb-6 font-medium">${slide.subtitle}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
                                <div class="flex flex-col justify-center">${slide.leftContent}</div>
                                <div class="flex flex-col justify-center">${slide.rightContent}</div>
                            </div>
                        </div>
                    `;
                } else if (slide.layout === "three-column") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center">
                            <h2 class="slide-title">${slide.title}</h2>
                            <p class="text-slate-400 text-xs -mt-6 mb-6 font-medium">${slide.subtitle}</p>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                ${slide.tiles.map(tile => `
                                    <div class="bg-slate-950 p-6 rounded-xl border border-slate-800/80 flex flex-col justify-between min-h-[280px]">
                                        <div>
                                            <div class="w-12 h-12 bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-xl mb-4">
                                                <i class="${tile.icon}"></i>
                                            </div>
                                            <h3 class="text-lg font-bold text-slate-200 font-heading mb-2">${tile.title}</h3>
                                            <p class="text-xs text-slate-400 leading-relaxed">${tile.desc}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (slide.layout === "objection") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center">
                            <h2 class="slide-title">${slide.title}</h2>
                            <p class="text-slate-400 text-xs -mt-6 mb-6 font-medium">${slide.subtitle}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
                                <div class="bg-accent-rose/5 border border-accent-rose/20 p-6 rounded-xl flex flex-col justify-between">
                                    <div>
                                        <h4 class="text-accent-rose font-heading font-bold text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                            <i class="fa-solid fa-triangle-exclamation"></i> Examiner Challenge
                                        </h4>
                                        <p class="text-sm text-slate-200 font-medium italic leading-relaxed">"${slide.objection}"</p>
                                    </div>
                                </div>
                                <div class="bg-accent-lime/5 border border-accent-lime/20 p-6 rounded-xl flex flex-col justify-between">
                                    <div>
                                        <h4 class="text-accent-lime font-heading font-bold text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                                            <i class="fa-solid fa-shield-halved"></i> Rigorous Defense
                                        </h4>
                                        <p class="text-sm text-slate-300 leading-relaxed">${slide.defense}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (slide.layout === "table") {
                    renderedHtml += `
                        <div class="flex-grow flex flex-col justify-center">
                            <h2 class="slide-title">${slide.title}</h2>
                            <p class="text-slate-400 text-xs -mt-6 mb-6 font-medium">${slide.subtitle}</p>
                            <div class="overflow-hidden border border-slate-800 rounded-xl bg-slate-950">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-900 border-b border-slate-800">
                                            ${slide.tableHeader.map(h => `<th class="p-4 text-xs font-bold font-heading text-accent-teal uppercase tracking-wider">${h}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/50">
                                        ${slide.tableRows.map(row => `
                                            <tr class="hover:bg-slate-900/30 transition-colors">
                                                <td class="p-4 text-xs font-bold text-slate-200">${row[0]}</td>
                                                <td class="p-4 text-xs text-slate-400 leading-relaxed">${row[1]}</td>
                                                <td class="p-4 text-xs text-slate-400 leading-relaxed">${row[2]}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }

                slideDiv.innerHTML = renderedHtml;
                printBox.appendChild(slideDiv);
            });
        }
    </script>
</body>
</html>
